<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Login</title>
<style>
body { background:#5a5a1e; color:#e1e1b0; font-family:Verdana; padding:40px; }
.box { width:300px; margin:auto; background:#464619; padding:20px; border:1px solid #242400; }
input { width:100%; padding:10px; margin-top:10px; }
button { margin-top:10px; padding:10px; width:100%; background:#e3bf00; border:1px solid black; cursor:pointer; }
</style>
</head>
<body>

<div class="box">
    <h2>admin girişi</h2>
    <input id="pw" type="password" placeholder="şifre">
    <button onclick="login()">giriş yap</button>
    <div id="msg"></div>
</div>

<script>
async function login() {
    let pw = document.getElementById("pw").value;

    let r = await fetch("/admin/login", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ password: pw })
    });

    let j = await r.json();
    if (j.error) {
        document.getElementById("msg").innerText = j.error;
    } else {
        location.href = "/admin";
    }
}
</script>

</body>
</html>
