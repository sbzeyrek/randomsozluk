<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>admin panel - randomsözlük</title>

<style>
    body {
        margin: 0;
        background-color: #5a5a1e;
        font-family: Verdana, Arial, sans-serif;
        color: #e1e1b0;
        font-size: 12px;
    }

    a { color: #ffec8f; text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* SOL MENU (aynı tasarım) */
    #left {
        width: 180px;
        background-color: #464619;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid #242400;
        padding: 10px;
        position: fixed;
        top: 0;
        left: 0;
    }

    #left h4 {
        margin-top: 5px;
        margin-bottom: 10px;
        font-size: 14px;
    }

    #left a {
        display: block;
        padding: 6px 0;
        border-bottom: 1px solid #555;
        font-size: 12px;
    }

    #content {
        margin-left: 210px;
        padding: 25px;
        width: 650px;
    }

    h1 {
        font-family: "Comic Sans MS";
        font-size: 35px;
        text-align: center;
        color: #ffdf00;
        text-shadow: 2px 2px 3px black;
        margin: 0 0 20px 0;
    }

    .box {
        background-color: #464619;
        padding: 15px;
        border: 1px solid #242400;
        margin-bottom: 20px;
    }

    .stat {
        margin-bottom: 5px;
        font-size: 14px;
    }

    /* Mobil */
    @media (max-width: 768px) {
        #left {
            position: static;
            width: 100%;
            height: auto;
            padding: 10px;
            border-right: none;
        }

        #content {
            margin-left: 0;
            width: 100%;
            padding: 15px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>

</head>
<body>

<!-- SOL MENÜ -->
<div id="left">

    <h4>admin paneli</h4>

    <a href="/admin-54f6a12ca898b/dashboard.html">🏠 dashboard</a>
    <a href="#" onclick="openSection('titles')">📚 başlık yönetimi</a>
    <a href="#" onclick="openSection('entries')">✏️ entry yönetimi</a>
    <a href="#" onclick="logout()">🚪 çıkış</a>

    <h4 style="margin-top:20px;">istatistik</h4>
    <div id="adminStatsMini"></div>
</div>

<!-- İÇERİK -->
<div id="content">

    <h1>admin panel</h1>

    <!-- DASHBOARD ALANI -->
    <div id="dashboard" class="box">
        <h2>genel istatistikler</h2>

        <div id="stats">
            yükleniyor...
        </div>
    </div>

    <!-- BAŞLIK YÖNETİMİ -->
    <div id="titles" class="box" style="display:none;">
        <h2>başlık yönetimi</h2>
        <div id="titleListAdmin">yükleniyor...</div>
    </div>

    <!-- ENTRY YÖNETİMİ -->
    <div id="entries" class="box" style="display:none;">
        <h2>entry yönetimi</h2>
        <div id="entryListAdmin">entry sistemi sonra gelecek...</div>
    </div>

</div>

<script>
/* ============================================================
    SEKMELER ARASI GEÇİŞ
============================================================ */
function openSection(sec) {
    document.getElementById("dashboard").style.display = "none";
    document.getElementById("titles").style.display = "none";
    document.getElementById("entries").style.display = "none";

    document.getElementById(sec).style.display = "block";
}

/* ============================================================
    LOGOUT
============================================================ */
async function logout() {
    document.cookie = "admin=; Max-Age=0; path=/;";
    location.href = "/admin-54f6a12ca898b/login.html";
}

/* ============================================================
    DASHBOARD İSTATİSTİKLERİ
============================================================ */
async function loadStats() {
    let r = await fetch("/api/titles");
    let data = await r.json();

    let entryCount = 0;
    data.forEach(t => entryCount += (t.count + 1));

    document.getElementById("stats").innerHTML = `
        <div class="stat">📚 toplam başlık: <b>${data.length}</b></div>
        <div class="stat">✏️ toplam entry: <b>${entryCount}</b></div>
    `;

    document.getElementById("adminStatsMini").innerHTML = `
        başlık: ${data.length}<br>
        entry: ${entryCount}
    `;
}

/* ============================================================
    ADMİN PANELİ BAŞLIK LİSTESİ
============================================================ */
async function loadTitleManager() {
    let r = await fetch("/api/titles");
    let data = await r.json();

    let div = document.getElementById("titleListAdmin");
    div.innerHTML = "";

    data.forEach(t => {
        let box = document.createElement("div");
        box.style.padding = "5px 0";
        box.style.borderBottom = "1px solid #555";

        box.innerHTML = `
            <b>${t.title}</b> (${t.count})
            <button style="float:right;" onclick="deleteTitle('${t.folder}')">sil</button>
        `;

        div.appendChild(box);
    });
}

/* ============================================================
    BAŞLIK SİLME
============================================================ */
async function deleteTitle(folder) {
    if (!confirm("Bu başlık tamamen silinsin mi?")) return;

    await fetch("/admin-delete-title/" + folder, { method:"POST" });
    loadTitleManager();
    loadStats();
}

loadStats();
loadTitleManager();
</script>

</body>
</html>
