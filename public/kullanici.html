<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>kullanici - randomsozluk</title>
<style>
    body{margin:0;background-color:#5a5a1e;font-family:Verdana,Arial,sans-serif;color:#e1e1b0;font-size:12px;}
    a{color:#ffec8f;text-decoration:none;}
    a:hover{text-decoration:underline;}
    #left{width:180px;background-color:#464619;height:100vh;overflow-y:auto;border-right:1px solid #242400;padding:10px;position:fixed;top:0;left:0;}
    #searchBox{width:160px;padding:4px;background-color:#dfdfc3;border:1px solid #333;margin-bottom:10px;}
    #titleList a{display:block;padding:4px 0;border-bottom:1px solid #555;font-size:12px;}
    .entry-count{color:#b8b894;font-size:10px;float:right;}
    #content{margin-left:210px;padding:25px;width:650px;}
    h1{font-family:"Comic Sans MS";font-size:40px;text-align:center;color:#ffdf00;text-shadow:2px 2px 3px black;margin:0;}
    .box{background-color:#464619;padding:15px;border:1px solid #242400;margin-bottom:20px;}
    .entry-item{background-color:#3c3c14;padding:8px;border:1px solid #222;margin-bottom:6px;font-size:11px;}
    .entry-title{color:#ffec8f;}
    .entry-text{color:#c8c8a0;margin-top:4px;white-space:pre-wrap;word-break:break-word;}
    #userbar{text-align:right;margin-bottom:10px;font-size:11px;color:#b8b894;}
    #userbar a{color:#ffec8f;}
    @media(max-width:768px){
        #left{position:static;width:100%;height:auto;border-right:none;padding:10px;box-sizing:border-box;}
        #searchBox{width:100%;box-sizing:border-box;}
        #content{margin-left:0;width:100%;padding:15px;box-sizing:border-box;}
        h1{font-size:28px;}
    }
</style>
</head>
<body>

<div id="left">
    <input type="text" id="searchBox" placeholder="baslik ara" onkeyup="filterTitles()">
    <h4>basliklar</h4>
    <div id="titleList"></div>
</div>

<div id="content">
    <h1><a href="/">randomsozluk</a></h1>
    <div id="userbar"></div>
    <div class="box">
        <h2 id="profileNick" style="margin:0 0 6px 0;">...</h2>
        <span id="joinDate" style="color:#6a6a4a;font-size:10px;"></span>
    </div>
    <div class="box">
        <div style="color:#b8b894;font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:8px;">son entry'ler</div>
        <div id="entries"><i>yukleniyor...</i></div>
    </div>
</div>

<script>
function esc(s){
    if(typeof s!=="string")return"";
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
            .replace(/"/g,"&quot;").replace(/'/g,"&#x27;");
}

async function loadMe(){
    const r=await fetch("/api/me",{credentials:"include"});
    const d=await r.json();
    const bar=document.getElementById("userbar");
    if(d.loggedIn){
        bar.innerHTML='merhaba <a href="/dashboard.html"><b>'+esc(d.nick)+'</b></a> &nbsp;|&nbsp; <a href="#" onclick="doLogout()">cikis</a>';
    }else{
        bar.innerHTML='<a href="/giris.html">giris yap</a> &nbsp;|&nbsp; <a href="/kayit.html">kayit ol</a>';
    }
}

async function doLogout(){
    await fetch("/api/logout",{method:"POST",credentials:"include"});
    location.reload();
}

async function loadProfile(){
    const params=new URLSearchParams(location.search);
    const nick=params.get("nick");
    if(!nick){document.getElementById("profileNick").innerText="kullanici bulunamadi";return;}
    const r=await fetch("/api/user/"+encodeURIComponent(nick));
    const d=await r.json();
    if(d.error){document.getElementById("profileNick").innerText=d.error;document.getElementById("entries").innerHTML="";return;}
    document.title=esc(d.nick)+" - randomsozluk";
    document.getElementById("profileNick").innerText=d.nick;
    const joined=new Date(d.created_at);
    document.getElementById("joinDate").innerText="katilim: "+joined.toLocaleDateString("tr-TR");
    const box=document.getElementById("entries");
    if(!d.entries.length){box.innerHTML="<i>hic entry yok</i>";return;}
    box.innerHTML="";
    d.entries.forEach(e=>{
        let dt=new Date(e.date);
        let div=document.createElement("div");
        div.className="entry-item";
        div.innerHTML=
            '<span class="entry-title"><a href="/t/'+esc(e.slug)+'/index.html">'+esc(e.title||e.slug)+'</a></span>'+
            ' &mdash; <span style="color:#6a6a4a;font-size:10px;">'+dt.toLocaleDateString("tr-TR")+'</span>'+
            '<div class="entry-text">'+esc(e.text.slice(0,200))+(e.text.length>200?'...':'')+'</div>';
        box.appendChild(div);
    });
}

async function loadTitles(){
    const r=await fetch("/api/titles",{credentials:"include"});
    const list=await r.json();
    const div=document.getElementById("titleList");
    div.innerHTML="";
    list.forEach(t=>{
        let a=document.createElement("a");
        a.href="/t/"+t.slug;
        let c=t.count>0?' <span class="entry-count">('+t.count+')</span>':"";
        a.innerHTML=esc(t.title)+c;
        div.appendChild(a);
    });
}

function filterTitles(){
    const q=document.getElementById("searchBox").value.toLowerCase();
    document.querySelectorAll("#titleList a").forEach(a=>{
        a.style.display=a.innerText.toLowerCase().includes(q)?"block":"none";
    });
}

loadMe();loadTitles();loadProfile();
</script>
</body>
</html>
