<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>randomsözlük - random bilgi kaynağı</title>

<style>
    body {
        margin: 0;
        background-color: #5a5a1e;
        font-family: Verdana, Arial, sans-serif;
        color: #e1e1b0;
        font-size: 12px;
    }

    a { color: #ffec8f; text-decoration: none; }
    a:hover { text-decoration: underline; }

    #left {
        width: 180px;
        background-color: #464619;
        height: 100vh;
        overflow-y: auto;
        border-right: 1px solid #242400;
        padding: 10px;
        position: fixed;
        top: 0;
        left: 0;
    }

    #searchBox {
        width: 160px;
        padding: 4px;
        background-color: #dfdfc3;
        border: 1px solid #333;
        margin-bottom: 10px;
    }

    #titleList a {
        display: block;
        padding: 4px 0;
        border-bottom: 1px solid #555;
        font-size: 12px;
    }

    .entry-count {
        color: #b8b894;
        font-size: 10px;
        float: right;
    }

    #content {
        margin-left: 210px;
        padding: 25px;
        width: 650px;
    }

    h1 {
        font-family: "Comic Sans MS";
        font-size: 40px;
        text-align: center;
        color: #ffdf00;
        text-shadow: 2px 2px 3px black;
        margin: 0;
    }

    #subtitle {
        text-align: center;
        font-size: 15px;
        margin-bottom: 25px;
    }

    .box {
        background-color: #464619;
        padding: 15px;
        border: 1px solid #242400;
        margin-bottom: 20px;
    }

    input[type=text] {
        width: 95%;
        padding: 5px;
        background-color: #dfdfc3;
        border: 1px solid #333;
        font-size: 12px;
    }

    textarea {
        width: 95%;
        height: 130px;
        padding: 5px;
        background-color: white;
        border: 1px solid #111;
        font-size: 12px;
        color: black;
    }

    button {
        background-color: #e3bf00;
        border: 1px solid black;
        padding: 5px 12px;
        cursor: pointer;
        margin-top: 10px;
    }
</style>
</head>

<body>

<div id="left">
    <input type="text" id="searchBox" placeholder="başlık ara" onkeyup="filterTitles()">
    <h4>başlıklar</h4>
    <div id="titleList"></div>
</div>

<div id="content">

    <h1><a href="/">randomsözlük</a></h1>
    <div id="subtitle">
        random bilgi kaynağı<br><br><br>
        çaylaklığa dayanamadım bende kendiminkini yazdım arkadaşlar hoşgeldiniz.
        öyle takılın şimdilik. ciddiyete gerek filan yok kafanıza göre. sallayın.
    </div>

    <div id="newTitleBox" class="box">
        <h3>yeni başlık aç</h3>
        <input type="text" id="newTitle" placeholder="başlık adı">
        <br><br>
        <h4>ilk entry'i gir</h4>
        <input type="text" id="firstEntryNick" placeholder="nick'in">
        <br><br>
        <textarea id="firstEntryText" placeholder="nöronlarından geçenler"></textarea>
        <br>
        <button onclick="addTitleWithEntry()">başlığı ve entry'i ekle</button>
    </div>

</div>

<script>
/* =========================
   BAŞLIK LİSTESİ YÜKLEME
========================= */
async function loadTitles() {
    const res = await fetch("/api/titles");
    const titles = await res.json();

    const list = document.getElementById("titleList");
    list.innerHTML = "";

    if (titles.length === 0) {
        list.innerHTML = "<i>henüz başlık yok</i>";
        return;
    }

    titles.forEach(t => {
        let link = document.createElement("a");

        // t = { folder, title, count }
        link.href = "/titles/" + t.folder + "/index.html";

        let c = t.count > 0 ? ` <span class="entry-count">(${t.count})</span>` : "";

        link.innerHTML = t.title + c;
        list.appendChild(link);
    });
}

/* =========================
   YENİ BAŞLIK OLUŞTURMA
========================= */
async function addTitleWithEntry() {
    const title = document.getElementById("newTitle").value.trim();
    const nick  = document.getElementById("firstEntryNick").value.trim();
    const text  = document.getElementById("firstEntryText").value.trim();

    if (!title || !nick || !text)
        return alert("Boş bırakma!");

    const res = await fetch("/api/new-title", {
        method: "POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify({ title, nick, text })
    });

    const data = await res.json();

    if (data.error)
        return alert(data.error);

    window.location.href = "/titles/" + data.folder + "/index.html";
}

/* =========================
        FİLTRELEME
========================= */
function filterTitles() {
    const q = document.getElementById("searchBox").value.toLowerCase();
    const all = document.querySelectorAll("#titleList a");

    all.forEach(a => {
        a.style.display = a.innerText.toLowerCase().includes(q)
            ? "block"
            : "none";
    });
}

loadTitles();
</script>

</body>
</html>
